name: Build JARVIS Windows Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "jarvis-v*"

permissions:
  contents: write

jobs:
  windows-installers:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out JARVIS
        uses: actions/checkout@v4

      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the Cloudflare project
        run: node --test tests/worker.test.mjs desktop/test/*.test.cjs

      - name: Install pinned desktop build tools
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build NSIS EXE and WiX MSI
        working-directory: desktop
        run: npm run dist

      - name: Create verified desktop update manifest
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "jarvis-v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "The pushed tag must be $tag because desktop/package.json is version $version."
          }
          $exe = Get-ChildItem desktop/dist/JARVIS-AI-Setup-$version-x64.exe | Select-Object -First 1
          $msi = Get-ChildItem desktop/dist/JARVIS-AI-$version-x64.msi | Select-Object -First 1
          if (-not $exe -or -not $msi) { throw "The expected JARVIS installers were not created." }
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"
          $manifest = [ordered]@{
            schema = 1
            enabled = $true
            version = $version
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
            notes = "JARVIS $version keeps the optional local Hey JARVIS listener active from the visible Windows system tray when minimized and restores JARVIS to the front after the wake phrase, with all previous capabilities and confirmations."
            installers = [ordered]@{
              exe = [ordered]@{ url = "$base/$($exe.Name)"; sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
              msi = [ordered]@{ url = "$base/$($msi.Name)"; sha256 = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content desktop/dist/jarvis-desktop-update.json -Encoding utf8
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Installers
          path: |
            desktop/dist/*.exe
            desktop/dist/*.msi
            desktop/dist/jarvis-desktop-update.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish the automatic-update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $assets = @(
            "desktop/dist/JARVIS-AI-Setup-$env:RELEASE_VERSION-x64.exe",
            "desktop/dist/JARVIS-AI-$env:RELEASE_VERSION-x64.msi",
            "desktop/dist/jarvis-desktop-update.json"
          )
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not replace the JARVIS release assets." }
            gh release edit $env:RELEASE_TAG --title "JARVIS AI $env:RELEASE_VERSION" --latest
          } else {
            gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title "JARVIS AI $env:RELEASE_VERSION" --notes "Verified JARVIS Windows desktop release $env:RELEASE_VERSION. The installed app checks the linked Cloudflare website and applies this update when it closes." --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the JARVIS desktop release." }
